name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dépendances (openpyxl suffit pour les tests)
        run: pip install openpyxl pyflakes
      - name: Analyse statique (noms non définis, imports oubliés)
        run: python -m pyflakes backend outils tests scripts
      - name: Tests unitaires
        run: python -m unittest discover -s tests -t . -v
      - name: La démo en ligne (docs/) est à jour
        run: python -m outils.construire_demo_web --check
      - name: La démo en ligne ne dépend pas de la date du jour
        # 400 jours plus tard, la construction doit donner la même démo (aucune lecture de la date du jour)
        run: |
          sudo apt-get install -y -q faketime
          faketime '+400 days' python -m outils.construire_demo_web --check
      - name: Aucune donnée réelle versionnée
        run: |
          if git ls-files | grep -Ei '\.(xlsx|xlsm|xls|xlsb|sqlite3?|db|csv)$|journal_|chemin_fichier\.txt$'; then echo "Fichier de données versionné !" ; exit 1; fi
      - name: Aucun identifiant interne dans le code
        run: |
          if git grep -nIE "I[D] M[E]T [0-9]" -- . ':!.github'; then echo "Identifiant documentaire interne trouvé." ; exit 1; fi

  tests-windows:
    # L'application tourne sous Windows : mêmes tests, plus l'adapter Excel (COM) jusqu'au lancement d'Excel.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install openpyxl pywin32 pyflakes
      - name: Analyse statique
        run: python -m pyflakes backend outils tests scripts
      - name: Tests unitaires
        run: python -m unittest discover -s tests -t . -v
